name: Docker image

# Every push to main: run the tests (on SQLite and Postgres) and, at the same time, build the image for Intel/AMD and
# ARM with the next version (v1.2.3) baked in. Only once the tests pass is it published to GitHub Container Registry as
# ghcr.io/<owner>/waypoint:latest plus :1.2.3, :v1.2.3, :1.2 and :1 (so you can pin a version), the version tagged and a
# GitHub Release published for it; then untagged leftovers are deleted.
#
# Versions: each push bumps the patch number (v1.0.0 -> v1.0.1). Put "#minor" in a commit message (or start it with
# "feat:") for v1.1.0, and "#major" (or "BREAKING CHANGE") for v2.0.0.
# Pull requests (including Dependabot's) only run the tests, and only the ones the change can affect: a pull request
# that touches only the web app skips the Python tests, one that touches only the backend skips the web app's checks
# (see `changes`), and one that changes only the web app's source runs just the web app tests that import what it
# changed. Only main is ever released: a manual run from another branch just runs the tests, and re-running an
# old build never moves :latest back to it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      timings:
        description: Print each Postgres test's time, the slowest tests and classes, and the time spent making and dropping databases
        type: boolean
        default: false

concurrency:
  group: docker-image-${{ github.ref }}
  # A newer push replaces a pull request's run that's still going. On main a release is never cut off halfway;
  # the next run waits for it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# bash, which runs each step with -eo pipefail: a command that fails inside a pipeline fails the step (without it, only
# the last command in a pipeline counts, and a failed gh or curl passes silently).
defaults:
  run:
    shell: bash

jobs:
  # What a pull request changes, so the jobs it can't affect are skipped (a skipped job counts as passed, for the merge
  # gate too). Anything not listed as the web app's alone, or the backend's alone (the workflows, the Dockerfile, ...),
  # runs everything, and so does every push to main and every manual run.
  changes:
    runs-on: ${{ fromJSON(vars.RUNS_ON != '' && github.actor != 'dependabot[bot]' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read      # the pull request's list of changed files
    outputs:
      backend: ${{ steps.what.outputs.backend }}
      web: ${{ steps.what.outputs.web }}
      web_tests: ${{ steps.what.outputs.web_tests }}
    steps:
      - name: Which parts the change touches
        id: what
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            { echo "backend=true"; echo "web=true"; echo "web_tests=all"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          listing=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[] | [.status, .filename, (.previous_filename // "")] | @tsv')
          # A rename counts for both its old and its new path.
          files=$(cut -f2,3 <<< "$listing" | tr '\t' '\n' | grep . || true)
          # The files API lists at most 3,000; a pull request that big runs everything.
          if [ "$(grep -c . <<< "$files" || true)" -ge 3000 ]; then files="(too many to list)"; fi
          # Only the web app or docs: the Python tests can't be affected.
          web_only='^(frontend/|docs/|[^/]+\.md$)'
          # Only the backend, its tests or docs: the web app's checks can't be affected (ESLint also reads waypoint/static/).
          backend_only='^(waypoint/|tests/|docs/|[^/]+\.md$|pyproject\.toml$|poetry\.lock$)'
          backend=false web=false
          if grep -vqE "$web_only" <<< "$files"; then backend=true; fi
          if grep -vqE "$backend_only" <<< "$files" || grep -qE '^waypoint/static/' <<< "$files"; then web=true; fi
          # Which Vitest tests to run: only those whose imports reach a changed file under frontend/src/ (`vitest related`),
          # unless the change could reach every test: anything else in frontend/ (package.json, the lockfile, Vite's or
          # TypeScript's settings), the workflows or anything else not known to be outside the tests' reach (the tests
          # only import from frontend/src/), the tests' shared setup (src/test/), or a file deleted or renamed (whose importers no longer import it,
          # so `related` wouldn't find them). Every push to main runs them all.
          web_tests=$(grep -E '^frontend/src/' <<< "$files" | sed 's|^frontend/||' || true)
          beyond_tests='^(frontend/src/|waypoint/|tests/|docs/|[^/]+\.md$|pyproject\.toml$|poetry\.lock$)'
          if [ "$files" = "(too many to list)" ] || grep -qvE "$beyond_tests" <<< "$files" \
             || grep -qE '^frontend/src/test/' <<< "$files" \
             || awk -F'\t' '$1 == "removed" || $1 == "renamed"' <<< "$listing" | cut -f2,3 | grep -q 'frontend/'; then
            web_tests=all
          fi
          { echo "backend=$backend"; echo "web=$web"; echo "web_tests<<END_OF_FILES"; echo "$web_tests"; echo "END_OF_FILES"; } >> "$GITHUB_OUTPUT"
          echo "Python tests: $backend; web app checks: $web; web app tests: $([ "$web_tests" = all ] && echo all || echo "related to $(grep -c . <<< "$web_tests" || true) changed file(s)")"

  # The Python tests, on SQLite (with coverage, lint and type-check) and on Postgres.
  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ fromJSON(vars.RUNS_ON != '' && github.actor != 'dependabot[bot]' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false         # one database failing still shows what the other found
      matrix:
        # 3.14 is the only Python Waypoint supports: what the image runs (see the Dockerfile).
        include:
          - {python: "3.14", database: sqlite}
          - {python: "3.14", database: postgres}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-poetry   # zizmor: ignore[self-repository] -- GitHub's documented form for a local action
        with:
          cache-name: ${{ matrix.database }}
          python-version: ${{ matrix.python }}
      # A throwaway Postgres for the tests, not a service container: a service can't take server settings. The data
      # directory is in memory and nothing is flushed to disk (fsync, synchronous_commit and full_page_writes off): a
      # crash loses the database, which is fine for a database that lives for one test run. Never for the image, the
      # Compose files or the docs' production setup. max_connections follows the number of test processes.
      - name: Start Postgres (postgres)
        if: matrix.database == 'postgres'
        run: |
          jobs="$(tools/test_jobs.sh)"
          echo "TEST_JOBS=$jobs" >> "$GITHUB_ENV"
          docker rm -f waypoint-test-pg || true
          docker run -d --name waypoint-test-pg --shm-size=1g --tmpfs /var/lib/postgresql/data -p 5432:5432 \
            -e POSTGRES_USER=waypoint -e POSTGRES_PASSWORD=waypoint -e POSTGRES_DB=waypoint postgres:16 \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c shared_buffers=512MB -c max_connections="$(( jobs * 30 + 100 ))"
          for _ in $(seq 1 60); do
            docker exec waypoint-test-pg pg_isready -h 127.0.0.1 -p 5432 -U waypoint -d waypoint && exit 0
            sleep 1
          done
          docker logs waypoint-test-pg
          exit 1
      - name: Run tests (postgres)
        if: matrix.database == 'postgres'
        env:
          DATABASE_URL: postgresql://waypoint:waypoint@localhost:5432/waypoint
          TIMINGS: ${{ inputs.timings }}
          PYTHONPATH: .            # so unittest-parallel finds tests/timing_result.py
        run: |
          if [ "$TIMINGS" = true ]; then
            export TIMINGS_DIR="$RUNNER_TEMP/timings"
            poetry run unittest-parallel -t . -s tests -j "$TEST_JOBS" --result tests.timing_result.TimingResult || status=$?
            tools/fleet test-timings "$TIMINGS_DIR" | tee -a "$GITHUB_STEP_SUMMARY"
            exit "${status:-0}"
          fi
          poetry run unittest-parallel -t . -s tests -j "$TEST_JOBS"
      - name: Stop Postgres (postgres)
        if: matrix.database == 'postgres' && always()
        run: docker rm -f waypoint-test-pg
      # The SQLite run also measures how much of Waypoint the tests run: the table goes in the run's summary, and the
      # report goes to Codecov (the README's backend badge), along with each test's result (JUnit XML, from
      # tests/junit_result.py) for Codecov's test analytics.
      - name: Run tests (sqlite) and measure coverage
        if: matrix.database == 'sqlite'
        env:
          JUNIT_DIR: junit
          PYTHONPATH: .            # so unittest-parallel finds tests/junit_result.py
        run: |
          poetry run unittest-parallel -t . -s tests -j 4 --coverage --coverage-rcfile pyproject.toml --result tests.junit_result.JUnitResult
          poetry run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          poetry run coverage xml -q -o coverage.xml
      - name: Upload coverage to Codecov
        if: matrix.database == 'sqlite'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5   # v7.1.1
        with:
          files: coverage.xml
          flags: backend
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false   # a Codecov outage never holds up a release
      # The floors are [tool.fleet.coverage] in pyproject.toml; tools/fleet runs fleet at the version .fleet/version names.
      - name: Coverage floor (fleet coverage-floor)
        if: matrix.database == 'sqlite'
        run: |
          poetry run coverage json -q -o coverage.json
          tools/fleet coverage-floor coverage.json
      - name: Upload test results to Codecov
        if: matrix.database == 'sqlite' && !cancelled()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5   # v7.1.1
        with:
          report_type: test_results
          files: junit/*.xml
          flags: backend
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Check dependencies for known vulnerabilities
        if: matrix.database == 'sqlite'
        run: poetry run pip-audit
      - name: Lint (Python with ruff)
        if: matrix.database == 'sqlite'
        run: poetry run ruff check .
      # Type-check (settings in pyproject.toml). mypy runs in the Poetry environment so it sees Waypoint's dependencies.
      - name: Type-check (Python with mypy)
        if: matrix.database == 'sqlite'
        run: poetry run mypy
      # The backend's import boundaries (import-linter's contracts in pyproject.toml; AGENTS.md → Layout).
      - name: Check import boundaries (Python with import-linter)
        if: matrix.database == 'sqlite'
        run: poetry run lint-imports

  # The feature map (docs/feature-map.json and its docs page) is generated from the routes, the web app, the tests and
  # the docs, so any of them can make it stale; it runs on every change. So does the API contract (docs/openapi.json and
  # the web app's lib/api-types.ts, from the routes and waypoint/server/contract.py), which a change to either side can
  # make stale. Standard library only: no setup beyond Python.
  feature-map:
    runs-on: ${{ fromJSON(vars.RUNS_ON != '' && github.actor != 'dependabot[bot]' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Check the feature map is up to date and every route has a test
        run: python3 tools/feature_map.py --check
      - name: Check the API contract (docs/openapi.json, frontend/src/lib/api-types.ts) is up to date
        if: ${{ !cancelled() }}
        run: python3 tools/api_contract.py --check

  # Checks that replaced instructions agents kept getting wrong, run by fleet's reusable workflow (AnthonyPluth/fleet,
  # .github/workflows/checks.yml) from fleet at the pin below, never from a ref the pull request names: `fleet checks`
  # ([tool.fleet] in pyproject.toml, plus Waypoint's own tools/app_checks.py; on a pull request also the commits'
  # trailers, removed tests and images) and `fleet drift` (the AGENTS.md blocks and the vendored .claude/ files equal to
  # fleet's at .fleet/version). The job reads the repository and nothing else.
  fleet-checks:
    permissions:
      contents: read
    uses: AnthonyPluth/fleet/.github/workflows/checks.yml@b256f95f618d7bebdfe03016e20fdf8b906cd53d   # v3.2.0
    with:
      # The runner, as JSON. The key is quoted because the workflow conventions check holds every `runs-on:` line to a
      # job's form, and this one is an input.
      "runs-on": ${{ vars.RUNS_ON != '' && github.actor != 'dependabot[bot]' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.RUNS_ON || '"ubuntu-latest"' }}

  # The web app (frontend/): type-check and lint it (the lint covers waypoint/static/ too), run its unit tests with
  # coverage, and build it (reporting its bundle sizes to Codecov).
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ fromJSON(vars.RUNS_ON != '' && github.actor != 'dependabot[bot]' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-app   # zizmor: ignore[self-repository] -- GitHub's documented form for a local action
        with:
          directory: frontend
      - name: Type-check (svelte-check)
        run: npm run check
      - name: Lint (ESLint, also over waypoint/static/)
        run: npm run lint
      - name: Unit tests (Vitest), measuring coverage
        if: needs.changes.outputs.web_tests == 'all'
        run: npm run coverage -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
      # A pull request that changes only files under src/ runs just the tests that import them (see `changes`), without
      # coverage: a share of the tests would report most of the app as untested.
      - name: Unit tests (Vitest), only those the change can affect
        if: needs.changes.outputs.web_tests != 'all'
        env:
          CHANGED: ${{ needs.changes.outputs.web_tests }}
        run: |
          mapfile -t changed < <(grep . <<< "$CHANGED" || true)
          if [ "${#changed[@]}" -eq 0 ]; then echo "No file under frontend/src/ changed."; exit 0; fi
          npx vitest related --run --passWithNoTests "${changed[@]}"   # every path starts with src/, never with -
      - name: Upload coverage to Codecov
        if: needs.changes.outputs.web_tests == 'all'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5   # v7.1.1
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: needs.changes.outputs.web_tests == 'all' && !cancelled()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5   # v7.1.1
        with:
          report_type: test_results
          files: frontend/junit.xml
          flags: frontend
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Build (and send its bundle sizes to Codecov)
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: npm run build

  # The image pipeline is fleet's reusable workflow (AnthonyPluth/fleet, .github/workflows/docker.yml), called twice: the
  # build runs while the tests run (it works out the version, builds the image, checks it starts and fills the build
  # cache, with no permission to publish), and the publish runs once the tests, the web app's checks and the build have
  # passed (push, tag, Release, then the cleanup of untagged leftovers). Only main is ever released: fleet's publish
  # also refuses a pull request, so a mistake here can't publish one. Both calls grant contents: write and packages:
  # write, because GitHub checks every job of the called workflow against the calling job's grant, even the jobs the
  # inputs skip; each of fleet's jobs takes only what it needs. At v3.0.0 its workflow starts from `permissions: {}`:
  # build has `contents: read` (line 117); publish has `contents: write` and `packages: write` (line 240) and runs only
  # on main, never for a pull request or pull_request_target (line 237); cleanup has `packages: write` alone (line 334).
  # The statuses are "build / Build", "publish / Publish" and "publish / Cleanup"; the merge gate counts this workflow, "Docker image", not its jobs.
  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write          # the ceiling for fleet's jobs; its build job takes contents: read
      packages: write
    uses: AnthonyPluth/fleet/.github/workflows/docker.yml@b256f95f618d7bebdfe03016e20fdf8b906cd53d   # v3.2.0
    with:
      image: waypoint
      smoke-env: WAYPOINT_ALLOW_NO_AUTH=1
      "runs-on": ${{ vars.RUNS_ON != '' && github.actor != 'dependabot[bot]' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.RUNS_ON || '"ubuntu-latest"' }}

  publish:
    needs: [test, web, build]
    if: needs.build.outputs.skip != 'true'
    permissions:
      contents: write          # the tag and the release
      packages: write          # the push, and the cleanup of untagged versions
    uses: AnthonyPluth/fleet/.github/workflows/docker.yml@b256f95f618d7bebdfe03016e20fdf8b906cd53d   # v3.2.0
    with:
      image: waypoint
      publish: true
      version: ${{ needs.build.outputs.version }}
      new: ${{ needs.build.outputs.new }}
      newest: ${{ needs.build.outputs.newest }}
      "runs-on": ${{ vars.RUNS_ON != '' && github.actor != 'dependabot[bot]' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.RUNS_ON || '"ubuntu-latest"' }}
