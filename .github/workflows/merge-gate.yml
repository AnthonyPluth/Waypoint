name: Merge gate

# One commit status, "Merge gate", on each pull request's head, set by fleet's reusable merge gate (AnthonyPluth/fleet,
# .github/workflows/merge-gate.yml, whose rules are its .github/scripts/merge-gate.sh): passing once every workflow the
# pull request started has succeeded, the required ones ran at all, every other app's check run and every commit
# status has passed and the required statuses are set; pending while anything still runs; failing otherwise. Require
# it in a ruleset on main (Settings → Rules → Rulesets → Require status checks to pass → "Merge gate") and it's the one
# check a merge waits on. It also merges Dependabot's pull requests once it passes, fleet's pin bumps included
# (automerge-fleet-bumps below, the owner's decision, #525). A ruleset on main that required a Code Owner review would
# still hold every action bump, fleet's included, until the owner gave it (CODEOWNERS covers .github/), whatever these
# inputs say.
#
# The triggers stay here, because a called workflow can't declare them. It runs from main's copy with a write token
# and never checks out or runs a pull request's code (the only checkout is fleet's script at the pin below), so it
# works for pull requests from forks too.
# workflow_run is safe here: nothing of the pull request is checked out, and the event's values reach the script as
# environment variables.
on:  # zizmor: ignore[dangerous-triggers]
  # Each of the pull request's own workflows finishing (the last one to finish decides).
  workflow_run:
    workflows: [Docker image, Security scans, Docs, Control smoke]
    types: [completed]
  # Other apps' checks finishing (CodeQL, Codecov); GitHub doesn't send this for Actions' own.
  check_suite:
    types: [completed]
  # By hand, to decide a pull request again; the agent review and the threads workflow start it this way.
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        required: true

permissions: {}

# The newest evaluation of a commit wins: an older one still running would only report older news.
concurrency:
  group: merge-gate-${{ github.event.workflow_run.head_sha || github.event.check_suite.head_sha || inputs.pr }}
  cancel-in-progress: true

# Every step runs in fleet's workflow; the default is here so the workflow conventions check reads the same shape in
# every file.
defaults:
  run:
    shell: bash

jobs:
  gate:
    # Pull requests only (main's own runs and scheduled scans have none).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'check_suite' && github.event.check_suite.app.slug != 'github-actions')
    permissions:
      contents: write          # merge Dependabot's pull requests
      pull-requests: write     # merge them, and read their commits, files and review threads
      statuses: write          # the "Merge gate" status
      actions: write           # read the pull request's workflow runs, and start main's release after a merge
      checks: read             # other apps' check runs
    uses: AnthonyPluth/fleet/.github/workflows/merge-gate.yml@b554ed883ec02bab75af3ba976743a3b4ed3ba5a   # v2.2.0
    with:
      sha: ${{ github.event.workflow_run.head_sha || github.event.check_suite.head_sha }}
      pr: ${{ inputs.pr }}
      required-workflows: |
        Docker image
        Security scans
        CodeQL
      # required-statuses is left at fleet's default, "Second review" alone: the first review is off (fleet's default),
      # so no "Agent review" status is set. To switch it back on, pass `first-review: true` in agent-review.yml and
      # required-statuses here listing both "Agent review" and "Second review".
      # Hold the gate until Codex has reviewed the head commit (a review on it, or its comment naming it); Dependabot's
      # pull requests are exempt. merge-gate-threads.yml's codex-comment job re-runs the gate when that comment lands.
      require-codex-review: true
      # Merge Dependabot's fleet pin bumps too once the gate passes, like its other pull requests (#525); the checks,
      # the open Codex P1/P2 threads and the Dependabot-only, same-repository conditions still apply. A merge made with
      # the gate's token starts no push workflow, so after it the gate starts main's docker.yml and security.yml
      # (fleet's default) and fleet-sync.yml, which opens the "chore: fleet content" pull request; that one is still
      # merged by hand.
      automerge-fleet-bumps: true
      after-merge-workflows: docker.yml security.yml fleet-sync.yml
      # Informational: the screenshot diff never decides a merge.
      ignored-workflows: Screenshot diff
