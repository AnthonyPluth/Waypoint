name: Control smoke

# tools/control (the session agents drive the app with) end to end on the real demo server under the frozen clock:
# doctor, start, snapshot, screenshot, a few flows, reset, stop, and nothing left running
# (frontend/verify/control-smoke.mjs; `make control-smoke` runs it locally), run by fleet's reusable verify workflow
# (AnthonyPluth/fleet, .github/workflows/verify.yml), which sets up Python with Poetry, Node with the web app's
# packages, the Playwright browser and libfaketime, then runs the target. It runs only for changes to what it
# exercises. The job's name is the status the merge gate lists.
on:
  push:
    branches: [main]
    paths: [frontend/verify/**, waypoint/verify.py, tools/control, Makefile, poetry.lock, frontend/package-lock.json, .github/workflows/control-smoke.yml]
  pull_request:
    branches: [main]
    paths: [frontend/verify/**, waypoint/verify.py, tools/control, Makefile, poetry.lock, frontend/package-lock.json, .github/workflows/control-smoke.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: control-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every step runs in fleet's workflow; the default is here so the workflow conventions check reads the same shape in
# every file.
defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Control smoke
    permissions:
      contents: read
    uses: AnthonyPluth/fleet/.github/workflows/verify.yml@b256f95f618d7bebdfe03016e20fdf8b906cd53d   # v3.2.0
    with:
      make-target: control-smoke
      timeout-minutes: 20
      # The runner, as JSON: the repository's own (vars.RUNS_ON) for its own pull requests and pushes, GitHub's for
      # Dependabot's and forks'. The key is quoted because the workflow conventions check holds every `runs-on:` line
      # to a job's form, and this one is an input.
      "runs-on": ${{ vars.RUNS_ON != '' && github.actor != 'dependabot[bot]' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.RUNS_ON || '"ubuntu-latest"' }}
