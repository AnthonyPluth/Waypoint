name: iOS

# The iPhone app shell (ios/): XcodeGen writes the project from ios/project.yml, then xcodebuild builds the app and runs
# the unit tests on an iPhone simulator, unsigned. It runs only for changes to the app and to this workflow, on GitHub's
# Xcode 27 runner (the app needs Xcode, which only runs on a Mac). The job's name is the status the merge gate lists.
on:
  push:
    branches: [main]
    paths: [ios/**, "!ios/**/*.md", waypoint/static/ios-icon-1024.png, .github/workflows/ios.yml]
  pull_request:
    branches: [main]
    paths: [ios/**, "!ios/**/*.md", waypoint/static/ios-icon-1024.png, .github/workflows/ios.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: iOS build and tests
    # GitHub's hosted Xcode 27 image (actions/runner-images README: "Xcode 27 | arm64 | `xcode-27` or `xcode-27-xlarge`";
    # images/macos/xcode-27-arm64-Readme.md lists Xcode 27.0, 27.1 (the default) and 27.2 with the iOS 27.0-27.2 SDKs).
    # fleet checks accepts xcode-<number> since fleet v7.1.0 (AnthonyPluth/fleet#148). Moved from macos-26 early, by the
    # owner's decision, because macos-26 jobs were going unacquired under GitHub's macOS arm64 capacity limits.
    runs-on: xcode-27   # hosted: the iOS 27 SDK needs Xcode 27 and macos-26 stops at iOS 26.5
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios/package-lock.json
      - name: Install the packages
        working-directory: ios
        run: npm ci --no-audit --no-fund
      - name: Select Xcode 27.2 and require the iOS 27 SDK
        # App Store Connect requires the iOS 27 SDK from April 2027 (ITMS-90725). Xcode 27.2 is a release, not a beta;
        # the image's default Xcode.app is 27.1. If an upload is refused with ITMS-90534 on 27.2, try Xcode_27.1.app.
        run: |
          developer_dir=/Applications/Xcode_27.2.app/Contents/Developer
          [ -d "$developer_dir" ] || { echo "::error::Xcode 27.2 is not at $developer_dir on this runner image."; ls /Applications; exit 1; }
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$developer_dir"
          xcodebuild -version
          [ "$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')" -ge 27 ]
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          [[ "$sdk" == 27.* ]] || { echo "::error::The iOS SDK is $sdk, not 27.x."; exit 1; }
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen
      - name: Pick an iPhone simulator
        run: |
          xcrun simctl list devices available
          # A plain numbered iPhone ("iPhone 17", "iPhone 17 Pro") on the newest iOS runtime: the Xcode 27 image's runtimes
          # also list devices such as "iPhone Duo", which a pick of the first name starting with "iPhone" could choose.
          udid=$(xcrun simctl list devices available -j | python3 -I -c '
          import json, re, sys
          picks = []
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              v = re.search(r"\.iOS-(\d+)-(\d+)$", runtime)
              for d in devices if v else []:
                  m = re.fullmatch(r"iPhone (\d+)( Pro)?", d["name"])
                  if m:
                      picks.append(((int(v[1]), int(v[2])), int(m[1]), not m[2], d["name"], runtime, d["udid"]))
          if not picks:
              sys.exit("No iPhone <number> or iPhone <number> Pro simulator is available.")
          best = max(picks)
          print("Simulator:", best[3], best[4], file=sys.stderr)
          print(best[5])
          ')
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: Build and test
        working-directory: ios
        run: |
          xcodebuild test \
            -project Waypoint.xcodeproj \
            -scheme Waypoint \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Check the app bundle holds what Capacitor needs
        # Capacitor exits the app at launch when public/ or capacitor.config.json is missing from the bundle (a mistake in ios/project.yml once left them out).
        working-directory: ios
        run: |
          app=build/Build/Products/Debug-iphonesimulator/Waypoint.app
          [ -d "$app" ] || { echo "::error::The built app is not at $app."; exit 1; }
          for f in public/index.html capacitor.config.json; do
            [ -f "$app/$f" ] || { echo "::error::$f is missing from Waypoint.app. The app would exit at launch. Check the sources in ios/project.yml."; exit 1; }
          done
