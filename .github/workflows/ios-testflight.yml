name: iOS TestFlight

# Builds a signed release of the iPhone app (ios/) and uploads it to TestFlight. Started by hand, or by a push to main
# that changes the app (never by a pull request): the job runs in the protected "testflight" environment, which holds the
# signing secrets and waits for the owner's approval before each run, and only from main. A change to the web app alone
# does not start it: the app loads the person's own server and bundles no web files. Setup is in ios/README.md. The
# unsigned build and tests are the "iOS" workflow.
on:
  push:
    branches: [main]
    paths: [ios/**, "!ios/**/*.md", waypoint/static/ios-icon-1024.png, .github/workflows/ios-testflight.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  upload:
    name: Build and upload to TestFlight
    if: github.ref == 'refs/heads/main'
    # GitHub's hosted Xcode 27 image (actions/runner-images README: "Xcode 27 | arm64 | `xcode-27` or `xcode-27-xlarge`";
    # images/macos/xcode-27-arm64-Readme.md lists Xcode 27.0, 27.1 (the default) and 27.2 with the iOS 27.0-27.2 SDKs).
    # fleet checks accepts xcode-<number> since fleet v7.1.0 (AnthonyPluth/fleet#148). Moved from macos-26 early, by the
    # owner's decision, because macos-26 jobs were going unacquired under GitHub's macOS arm64 capacity limits.
    runs-on: xcode-27   # hosted: the iOS 27 SDK needs Xcode 27 and macos-26 stops at iOS 26.5
    timeout-minutes: 45
    environment: testflight
    steps:
      - name: Check the signing secrets and variables are set
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
          WAYPOINT_BUNDLE_ID: ${{ vars.WAYPOINT_BUNDLE_ID }}
        run: |
          missing=""
          for name in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 \
              APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_P8_BASE64 \
              DEVELOPMENT_TEAM WAYPOINT_BUNDLE_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::TestFlight is not set up yet. Missing in the 'testflight' environment:$missing. See ios/README.md, 'TestFlight'."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 22
      - name: Install the packages
        working-directory: ios
        run: npm ci --no-audit --no-fund
      - name: Select Xcode 27.2 and require the iOS 27 SDK
        # App Store Connect requires the iOS 27 SDK from April 2027 (ITMS-90725). Xcode 27.2 is a release, not a beta;
        # the image's default Xcode.app is 27.1. If an upload is refused with ITMS-90534 on 27.2, try Xcode_27.1.app.
        run: |
          developer_dir=/Applications/Xcode_27.2.app/Contents/Developer
          [ -d "$developer_dir" ] || { echo "::error::Xcode 27.2 is not at $developer_dir on this runner image."; ls /Applications; exit 1; }
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$developer_dir"
          xcodebuild -version
          [ "$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')" -ge 27 ]
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          [[ "$sdk" == 27.* ]] || { echo "::error::The iOS SDK is $sdk, not 27.x."; exit 1; }
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen
      - name: Import the certificate and provisioning profile
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/waypoint-signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          echo "::add-mask::$keychain_password"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          rm -f "$RUNNER_TEMP/profile.plist"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
          echo "PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
      - name: Find the latest release version
        id: version
        # Read now, after the environment's approval, so a release cut while the run waited counts. Releases are cut by docker.yml.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          tag=$(gh api "repos/$REPO/releases/latest" --jq .tag_name) || {
            echo "::error::Could not read the latest GitHub Release, so the TestFlight version is unknown. The build stops rather than use a made-up version."
            exit 1
          }
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::The latest GitHub Release's tag is not vX.Y.Z, so it cannot be the TestFlight version (Apple needs three dot-separated integers). The build stops rather than use a made-up version."
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "TestFlight version ${tag#v}, build $GITHUB_RUN_NUMBER"
      - name: Archive the app
        working-directory: ios
        env:
          DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
          WAYPOINT_BUNDLE_ID: ${{ vars.WAYPOINT_BUNDLE_ID }}
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild archive \
            -project Waypoint.xcodeproj \
            -scheme Waypoint \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Waypoint.xcarchive" \
            -derivedDataPath build \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            WAYPOINT_BUNDLE_ID="$WAYPOINT_BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
      - name: Export the .ipa
        env:
          DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
          WAYPOINT_BUNDLE_ID: ${{ vars.WAYPOINT_BUNDLE_ID }}
        run: |
          python3 - <<'PY'
          import os
          import plistlib

          options = {
              "method": "app-store-connect",
              "teamID": os.environ["DEVELOPMENT_TEAM"],
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "provisioningProfiles": {os.environ["WAYPOINT_BUNDLE_ID"]: os.environ["PROFILE_NAME"]},
              "uploadSymbols": True,
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as out:
              plistlib.dump(options, out)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Waypoint.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APP_STORE_CONNECT_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP/export/Waypoint.ipa" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Delete the keychain, profile and keys
        if: always()
        run: |
          # Backstop: the certificate and profile files are already deleted after import; -f tolerates that.
          security delete-keychain "$RUNNER_TEMP/waypoint-signing.keychain-db" || true
          rm -rf "$HOME/.appstoreconnect/private_keys" \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" \
            "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/export" "$RUNNER_TEMP/Waypoint.xcarchive"
