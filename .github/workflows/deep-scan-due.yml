name: Deep scan due

# Every quarter, one issue, "Deep security scan due" (labels manual, security), unless one is open, with the link to
# fleet's deep-scan runbook at the pin below, the revision of the last scan and the number of commits since, opened by
# fleet's reusable workflow (AnthonyPluth/fleet, .github/workflows/deep-scan-due.yml; docs/deep-scan.md there). The
# scan itself needs a person's own session, so a workflow can only remind. No secrets.
on:
  schedule:
    - cron: "17 7 2 1,4,7,10 *"   # quarterly
  workflow_dispatch:

permissions: {}

# Every step runs in fleet's workflow; the default is here so the workflow conventions check reads the same shape in
# every file.
defaults:
  run:
    shell: bash

jobs:
  remind:
    permissions:
      contents: read   # count the commits since the last scan
      issues: write    # read the earlier issues and open the reminder
    uses: AnthonyPluth/fleet/.github/workflows/deep-scan-due.yml@b554ed883ec02bab75af3ba976743a3b4ed3ba5a   # v2.2.0
