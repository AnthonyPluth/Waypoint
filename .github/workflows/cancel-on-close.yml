name: Cancel runs on close

# When a pull request is merged or closed, stop its runs that are still going: the Docker image build and tests, and
# the security scans. Nothing is lost, since a merge starts main's own runs. fleet's reusable workflow
# (AnthonyPluth/fleet, .github/workflows/cancel-on-close.yml) joins each group below with cancel-in-progress, one job
# per group; the names must match the workflows' groups, and {0} is the pull request's number, never github.ref (on a
# merged pull request's closed event that is main's, and joining main's groups would cancel its release and scans).
# No permission is needed: joining a group is what cancels. GitHub's own CodeQL checks come from the repository's
# settings, not a workflow here, so they aren't covered.
on:
  pull_request:
    types: [closed]

permissions: {}

# Every step runs in fleet's workflow; the default is here so the workflow conventions check reads the same shape in
# every file.
defaults:
  run:
    shell: bash

jobs:
  cancel:
    uses: AnthonyPluth/fleet/.github/workflows/cancel-on-close.yml@acfb09312e648eb5dde4ace69e8c849c7a33e789   # v1.1.0
    with:
      groups: '["docker-image-refs/pull/{0}/merge", "security-refs/pull/{0}/merge"]'   # docker.yml, security.yml
      # The runner, as JSON. The key is quoted because the workflow conventions check holds every `runs-on:` line to a
      # job's form, and this one is an input.
      "runs-on": ${{ vars.RUNS_ON != '' && github.actor != 'dependabot[bot]' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.RUNS_ON || '"ubuntu-latest"' }}
