name: Docs

# The documentation site (docs/, built with Astro Starlight), published to GitHub Pages at
# https://anthonypluth.github.io/Waypoint/. A pull request that changes it only builds it, which also checks every link
# between pages (starlight-links-validator); a push to main builds and publishes it.
# Needs Settings → Pages → Build and deployment → Source: "GitHub Actions" once.
on:
  push:
    branches: [main]
    paths: [docs/**, demo/**, frontend/**, waypoint/static/fonts/**, waypoint/static/logo.svg, .github/workflows/docs.yml]
  pull_request:
    branches: [main]
    paths: [docs/**, demo/**, frontend/**, waypoint/static/fonts/**, waypoint/static/logo.svg, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# bash, which runs each step with -eo pipefail: a command that fails inside a pipeline fails the step (without it, only
# the last command in a pipeline counts, and a failed gh or curl passes silently).
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ fromJSON(vars.RUNS_ON != '' && github.actor != 'dependabot[bot]' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-app   # zizmor: ignore[self-repository] -- GitHub's documented form for a local action
        with:
          directory: docs
      - uses: ./.github/actions/setup-node-app   # zizmor: ignore[self-repository] -- local action
        with:
          directory: frontend
      - name: Build the standalone demo from the app frontend
        working-directory: frontend
        run: npm run build:demo
      - name: Install the demo verification browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify the standalone demo without runtime connections
        run: node demo/verify.mjs
      - name: Build the site
        working-directory: docs
        run: npm run build
      - name: Bundle the standalone static demo
        run: |
          mkdir -p docs/dist/demo
          cp -R frontend/demo-dist/. docs/dist/demo/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: docs/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNS_ON != '' && github.actor != 'dependabot[bot]' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      pages: write      # publish the site
      id-token: write   # prove to Pages the artifact came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
        id: deploy
