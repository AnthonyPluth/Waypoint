name: Docs

# The documentation site (docs/, built with Astro Starlight), published to GitHub Pages at
# https://anthonypluth.github.io/Waypoint/. A pull request that changes it only builds it, which also checks every link
# between pages (starlight-links-validator); a push to main builds and publishes it. The build and the deploy are
# fleet's reusable workflow (AnthonyPluth/fleet, .github/workflows/docs.yml), which runs `make docs-site`: the standalone
# demo is built and verified, the site is built, and then the demo is copied into it (the site build empties docs/dist,
# so the copy comes last). The statuses are "docs / build" and "docs / deploy"; the merge gate counts this workflow,
# "Docs". The calling job grants all three permissions, since a called workflow can't be given more than its caller has
# (on a pull request the deploy job is skipped). The grant is a ceiling, not what runs with it: fleet's workflow (at
# v3.0.0) starts from `permissions: {}`; its build job has `contents: read` only (line 78), and its deploy job, which
# alone has `pages: write` and `id-token: write` (line 126), runs only on main and never for a pull request (line 123).
# Needs Settings → Pages → Build and deployment → Source: "GitHub Actions" once.
on:
  push:
    branches: [main]
    paths: [docs/**, demo/**, frontend/**, Makefile, waypoint/static/fonts/**, waypoint/static/logo.svg, .github/workflows/docs.yml]
  pull_request:
    branches: [main]
    paths: [docs/**, demo/**, frontend/**, Makefile, waypoint/static/fonts/**, waypoint/static/logo.svg, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# bash, which runs each step with -eo pipefail: a command that fails inside a pipeline fails the step (without it, only
# the last command in a pipeline counts, and a failed gh or curl passes silently).
defaults:
  run:
    shell: bash

jobs:
  docs:
    permissions:
      contents: read
      pages: write      # publish the site
      id-token: write   # prove to Pages the artifact came from this workflow
    uses: AnthonyPluth/fleet/.github/workflows/docs.yml@b256f95f618d7bebdfe03016e20fdf8b906cd53d   # v3.2.0
    with:
      make-target: docs-site
      npm-lockfiles: |
        docs/package-lock.json
        frontend/package-lock.json
      browser: chromium
      "runs-on": ${{ vars.RUNS_ON != '' && github.actor != 'dependabot[bot]' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.RUNS_ON || '"ubuntu-latest"' }}
