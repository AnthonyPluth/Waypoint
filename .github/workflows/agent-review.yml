name: Agent review

# The independent reviews of every pull request an AI agent wrote, run by fleet's reusable workflow
# (AnthonyPluth/fleet, .github/workflows/agent-review.yml; docs/agent-review.md there): a fresh Claude Code session on
# Sonnet reads the change against main's AGENTS.md and .github/agent-review/context.md and sets the "Agent review"
# status; a risky pull request (labelled safety-critical or security, or changing .github/**, .claude/** or one of the
# files below) is read a second time by a different model, as the "Second review" status, against
# .github/agent-review/invariants.md. The merge gate requires both statuses. A pull request that isn't risky gets a
# passing "Second review" saying so.
#
# This caller declares the triggers (a called workflow can't) and passes the two secrets by name (secrets: inherit
# would hand over every secret). pull_request_target runs main's copy of this file and of fleet's workflow at the pin
# below, so a pull request can't change how it is reviewed; the pull request's code is only read, never run. The job
# grants what the called jobs ask for (a called workflow can't be given more than its caller has). The labelled and
# unlabelled events start only the second review.
on:  # zizmor: ignore[dangerous-triggers] -- runs main's workflow; the pull request's code is only read, never run
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions: {}

# Every step runs in fleet's workflow; the default is here so the workflow conventions check reads the same shape in
# every file.
defaults:
  run:
    shell: bash

jobs:
  review:
    permissions:
      contents: read           # main's instructions and the pull request's code
      pull-requests: write     # the comment (and the pull request's commits and comments)
      statuses: write          # the "Agent review" and "Second review" statuses
      actions: write           # start the merge gate
    uses: AnthonyPluth/fleet/.github/workflows/agent-review.yml@281821f17c9a84d59412c33badf5cfdf9cc31d3b   # v1.0.0
    with:
      # Left out of the diff the reviewer reads (still listed for it): the generated API contract and feature map.
      generated: |
        docs/openapi.json
        frontend/src/lib/api-types.ts
        docs/feature-map.json
        docs/src/content/docs/contributing/feature-map.md
      budget-usd: ${{ vars.AGENT_REVIEW_BUDGET_USD || '3' }}
      max-turns: ${{ vars.AGENT_REVIEW_MAX_TURNS || '60' }}
      # A change to one of these files is risky and gets the second review, beside the labels (safety-critical,
      # security) and .github/** and .claude/**, which always count. The list is short on purpose: the exact files that
      # implement the security promises (sign-in, outbound TLS, visibility, a trip's people, loyalty numbers, the
      # offline copy and its encrypted store, the handlers and modules that serve a kept message, log scrubbing), the
      # Semgrep rules, SECURITY.md and the image's Dockerfile. It doesn't name every file a promise depends on: the full
      # set of invariants, and the checks that hold each, is in .github/agent-review/invariants.md, which the second
      # review reads; a pull request outside this list that touches one gets the second review only when labelled.
      # tests/test_agent_review_paths.py checks each file listed here exists.
      second-review-paths: |
        waypoint/oidc.py
        waypoint/tls.py
        waypoint/domain/visibility.py
        waypoint/domain/trippeople.py
        waypoint/domain/loyalty.py
        waypoint/domain/offline.py
        waypoint/server/api/review.py
        waypoint/server/api/trips.py
        waypoint/domain/mail/review.py
        waypoint/domain/mail/assist.py
        waypoint/monitoring.py
        frontend/src/lib/offline-vault.ts
        .semgrep/**
        SECURITY.md
        Dockerfile*
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
