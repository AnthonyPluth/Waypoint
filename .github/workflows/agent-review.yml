name: Agent review

# The Claude review of a risky pull request an AI agent wrote, run by fleet's reusable workflow (AnthonyPluth/fleet,
# .github/workflows/agent-review.yml; docs/agent-review.md there). The independent first review of every pull request
# is off, fleet's default since v2.0.0 (no "Agent review" status, no comment); Codex reviews every pull request instead.
# A risky pull request (labelled safety-critical or security, or changing .github/**, .claude/** or one of the files
# below) is read by a fresh Claude Code session against main's AGENTS.md, .github/agent-review/context.md and
# .github/agent-review/invariants.md, as the "Second review" status; one that isn't risky gets a passing "Second
# review" saying so, without running Claude, so only a risky pull request needs the ANTHROPIC_API_KEY or
# CLAUDE_CODE_OAUTH_TOKEN secret. The merge gate requires "Second review".
#
# This caller declares the triggers (a called workflow can't) and passes the two secrets by name (secrets: inherit
# would hand over every secret). pull_request_target runs main's copy of this file and of fleet's workflow at the pin
# below, so a pull request can't change how it is reviewed; the pull request's code is only read, never run. The job
# grants what the called jobs ask for (a called workflow can't be given more than its caller has). The labelled and
# unlabelled events start only the second review.
on:  # zizmor: ignore[dangerous-triggers] -- runs main's workflow; the pull request's code is only read, never run
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions: {}

# Every step runs in fleet's workflow; the default is here so the workflow conventions check reads the same shape in
# every file.
defaults:
  run:
    shell: bash

jobs:
  review:
    permissions:
      contents: read           # main's instructions and the pull request's code
      pull-requests: write     # the comment (and the pull request's commits and comments)
      statuses: write          # the "Second review" status (and "Agent review" when the first review is on)
      actions: write           # start the merge gate
    uses: AnthonyPluth/fleet/.github/workflows/agent-review.yml@b9f64fa5fd2859c87eabbbcda7b62e02b3dd0764   # v3.0.0
    with:
      # Left out of the diff the reviewer reads (still listed for it): the generated API contract and feature map.
      generated: |
        docs/openapi.json
        frontend/src/lib/api-types.ts
        docs/feature-map.json
        docs/src/content/docs/contributing/feature-map.md
      # The first review is off by fleet's default; to turn it back on, add `first-review: true` here and require both
      # "Agent review" and "Second review" in merge-gate.yml's required-statuses.
      # The first review's bounds, used only while it is on.
      budget-usd: ${{ vars.AGENT_REVIEW_BUDGET_USD || '3' }}
      max-turns: ${{ vars.AGENT_REVIEW_MAX_TURNS || '60' }}
      # A change to one of these files is risky and gets the second review, beside the labels (safety-critical,
      # security) and .github/** and .claude/**, which always count. The list is short on purpose (#518): the exact
      # files that directly implement the security promises (sign-in, outbound TLS, visibility, a trip's people, loyalty
      # numbers, a trip's photos and their grants and proxy, the offline copy and its encrypted store, log scrubbing),
      # the mail review and assist modules and the two handlers that serve a kept message (server/api/review.py,
      # server/api/trips.py), the assistant's mail-scope gate (server/mcp_access.py, MAIL_READABLE), the Semgrep rules,
      # SECURITY.md and the image's Dockerfile. It doesn't name every file a promise depends on: every other mail
      # module, handler, provider and the storage layer rely on Codex's review and the CI checks, and a pull request
      # touching one gets the second review only when labelled. The full set of invariants, and the checks that hold
      # each, is in .github/agent-review/invariants.md, which the second review reads. tests/test_agent_review_paths.py
      # checks each file listed here exists.
      second-review-paths: |
        waypoint/oidc.py
        waypoint/tls.py
        waypoint/domain/visibility.py
        waypoint/domain/trippeople.py
        waypoint/domain/loyalty.py
        waypoint/domain/photos.py
        waypoint/domain/photogrants.py
        waypoint/domain/photoproxy.py
        waypoint/domain/offline.py
        waypoint/server/api/review.py
        waypoint/server/api/trips.py
        waypoint/server/mcp_access.py
        waypoint/domain/mail/review.py
        waypoint/domain/mail/assist.py
        waypoint/monitoring.py
        frontend/src/lib/offline-vault.ts
        .semgrep/**
        SECURITY.md
        Dockerfile*
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
