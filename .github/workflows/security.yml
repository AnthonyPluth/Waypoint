name: Security scans

# Static analysis, dependency, container, secret and workflow scans, on top of what docker.yml already runs
# (pip-audit), run by fleet's reusable workflow (AnthonyPluth/fleet, .github/workflows/security.yml): Semgrep (the
# registry packs plus Waypoint's own rules in .semgrep/, checked against their examples first), npm audit over the web
# app, Trivy over the files (always) and over the image, zizmor over the workflows, and OpenSSF Scorecard on pushes
# and scheduled runs. Findings from Semgrep, Trivy, zizmor and Scorecard go to the Security tab (Code scanning), whose
# check runs the merge gate requires; npm audit fails the build itself. CodeQL and Dependabot alerts come from GitHub's
# own settings, not from here. Runs weekly too, because new vulnerabilities are published for code that hasn't changed.
#
# A pull request, and a push to main, runs only the scans its change can affect (the paths below); a change under
# .github/ runs everything, and so do the weekly and manual runs. The scripts come from fleet at the pin below.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every step runs in fleet's workflow; the default is here so the workflow conventions check reads the same shape in
# every file.
defaults:
  run:
    shell: bash

jobs:
  scans:
    permissions:
      contents: read
      pull-requests: read      # the pull request's changed files
      security-events: write   # the SARIF uploads
      actions: read            # Scorecard
      id-token: write          # Scorecard publishes its results
    uses: AnthonyPluth/fleet/.github/workflows/security.yml@b554ed883ec02bab75af3ba976743a3b4ed3ba5a   # v2.2.0
    with:
      code-paths: ^(waypoint|frontend/src|\.semgrep)/
      semgrep-paths: waypoint run.py frontend/src
      web-dirs: frontend
      image-paths: ^(Dockerfile|\.dockerignore|pyproject\.toml|poetry\.lock)$
      # The runner for every job but Scorecard's, as JSON: the repository's own runner (vars.RUNS_ON) for its own pull
      # requests and pushes, GitHub's for Dependabot's and forks', as every workflow here chooses it. The key is quoted
      # because the workflow conventions check holds every `runs-on:` line to a job's form, and this one is an input.
      "runs-on": ${{ vars.RUNS_ON != '' && github.actor != 'dependabot[bot]' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.RUNS_ON || '"ubuntu-latest"' }}
