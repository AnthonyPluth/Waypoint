# Dependabot keeps the build's moving parts up to date with weekly pull requests (daily for GitHub Actions). Each waits
# until a release is a week old (cooldown; 3 days for GitHub Actions): the merge gate merges Dependabot's pull requests
# by itself, and a compromised release is usually caught and pulled within days. Security updates for a known
# vulnerability don't wait.
version: 2
updates:
  # Python dependencies (pyproject.toml / poetry.lock)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]   # one PR for routine updates; major versions get their own
    commit-message:
      prefix: deps

  # Actions used by the workflows (.github/workflows/) and by the composite actions they share (.github/actions/). The
  # fleet reusable workflows (AnthonyPluth/fleet) move together in one group, first so they join it: the merge gate
  # merges such a bump once it passes, like any other Dependabot pull request (automerge-fleet-bumps in merge-gate.yml),
  # and then starts fleet-sync.yml, which opens the content's pull request for the owner to merge. This entry runs daily
  # with a 3-day cooldown for every action, fleet's pins included, so a fleet release gets its bump PR 3 days after it
  # (both the owner's decision, #525).
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    groups:
      fleet:
        patterns: ["AnthonyPluth/fleet", "AnthonyPluth/fleet/*"]   # by repository alone or with the workflow path
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # The web app's packages (frontend/package.json)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      web:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the Go rewrite) isn't supported by svelte-check yet (peer range ^5 || ^6).
      # Remove once svelte-check accepts typescript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: web

  # The documentation site's packages (docs/package.json: Astro Starlight)
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      docs:
        update-types: [minor, patch]
    commit-message:
      prefix: docs

  # The base images in the Dockerfile (python:3.14-slim, node:26-slim)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: docker
