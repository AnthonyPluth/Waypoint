# Alembic, for making new migrations by hand. Waypoint applies migrations itself when it starts.
#   poetry run alembic revision --autogenerate -m "add a column"   (after changing waypoint/storage/schema.py)
#   poetry run alembic upgrade head
# The database comes from DATABASE_URL, or the SQLite file in WAYPOINT_DATA (default ./data).
[alembic]
script_location = %(here)s/waypoint/storage/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
