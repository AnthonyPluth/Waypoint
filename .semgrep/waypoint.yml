# Waypoint's own Semgrep rules: the paved paths that earlier clean-ups left, so a copy of the old pattern fails CI
# instead of coming back. `make semgrep` runs them (`make lint` and `make check` include it), and so does the Semgrep
# job in .github/workflows/security.yml. Each rule has a passing and a failing example in .semgrep/examples/
# (checked by .semgrep/check_examples.py, part of `make semgrep`).
#
# Fix a finding by using the paved path. Where a use is right for a reason, put `# nosemgrep: <rule id>` on the line,
# with the reason beside it.
rules:
  - id: waypoint-raw-urlopen
    message: >-
      Make outbound HTTP calls through waypoint/tls.py's urlopen (certificate checks, https only, no stray redirects),
      not urllib.request's urlopen or build_opener.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: urllib.request.urlopen(...)
      - pattern: urllib.request.build_opener(...)
    paths:
      include: ["/waypoint/", "/run.py"]
      exclude: ["/waypoint/tls.py"]

  - id: waypoint-unvalidated-body
    message: >-
      Read a request body's fields through waypoint/validate.py (it rejects what isn't the right type with a message
      the user sees), not bool(), float() or int() on the raw value.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $F(body)
          - pattern: $F(body[...])
          - pattern: $F(body.get(...))
          - pattern: $F((body or ...)[...])
          - pattern: $F((body or ...).get(...))
      - metavariable-regex:
          metavariable: $F
          regex: ^(bool|float|int)$
    paths:
      include: ["/waypoint/server/api/"]

  - id: waypoint-sql-from-string
    message: >-
      Don't build SQL from strings (an f-string, +, % or .format): use SQLAlchemy's expressions, or bind
      parameters with sa.text(":name").
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: sqlalchemy.text(f"...")
      - pattern: sqlalchemy.text($A + $B)
      - pattern: sqlalchemy.text("..." % ...)
      - pattern: sqlalchemy.text("...".format(...))
      - pattern: text(f"...")
      - pattern: text($A + $B)
      - pattern: text("..." % ...)
      - pattern: text("...".format(...))
      - pattern: $C.exec_driver_sql(f"...")
      - pattern: $C.exec_driver_sql($A + $B)
      - pattern: $C.exec_driver_sql("..." % ...)
      - pattern: $C.exec_driver_sql("...".format(...))
      - pattern: $C.execute(f"...")
      - pattern: $C.execute("..." % ...)
      - pattern: $C.execute("...".format(...))
    paths:
      include: ["/waypoint/", "/run.py"]

  - id: waypoint-today-in-jobs
    message: >-
      Background jobs (the mail scan) and provider code take the `today` they're given (so a test, and the scan's
      local day, decide it) instead of reading the clock with date.today() (`today or date.today()` as a default is
      fine).
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: date.today()
          - pattern: datetime.date.today()
      # `today = today or date.today()`: the default for a caller that doesn't pass one.
      - pattern-not-inside: $T or date.today()
    paths:
      include:
        - "/waypoint/domain/mail/"
        - "/waypoint/providers/"

  - id: waypoint-utcnow
    message: >-
      datetime.utcnow() is deprecated and gives a naive time that reads as local. "Today" is the machine's local
      time (TZ); anything sent to another system carries its zone (datetime.now(timezone.utc)).
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: datetime.utcnow()
      - pattern: datetime.datetime.utcnow()
    paths:
      include: ["/waypoint/", "/run.py"]

  - id: waypoint-month-arithmetic
    message: >-
      Month arithmetic (adding months, a month's length, months between) goes through waypoint/dates.py, which
      clamps a day the month doesn't have; add the helper there if it's missing.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: dateutil.relativedelta.relativedelta(..., months=$N, ...)
      - pattern: dateutil.relativedelta.relativedelta(..., years=$N, ...)
      - pattern: relativedelta(..., months=$N, ...)
      - pattern: relativedelta(..., years=$N, ...)
      - pattern: calendar.monthrange(...)
      - pattern: $D.year * 12
      - pattern: ($A.year - $B.year) * 12
      - pattern: $D.month + $N
      - pattern: $D.month - $N
    paths:
      include: ["/waypoint/", "/run.py"]
      exclude: ["/waypoint/dates.py", "/waypoint/storage/migrations/"]

  # ---------------------------------------------------------------- Waypoint's promises (AGENTS.md)
  # These guard code that doesn't exist yet as well as code that does: the rule is in place before the feature, so the
  # first pull request that adds a trip query, a Gmail call or a loyalty number is held to it.

  - id: waypoint-print
    message: >-
      Write to the log through monitoring.log (the one place lines go out, so what's logged can be found and checked),
      not print(). Never log email content, names, confirmation codes or loyalty numbers (AGENTS.md, "Private data in
      logs and reports").
    severity: ERROR
    languages: [python]
    pattern: print(...)
    paths:
      include: ["/waypoint/"]
      exclude: ["/waypoint/monitoring.py", "/waypoint/verify.py"]

  - id: waypoint-google-hosts
    message: >-
      Only waypoint/providers/gmail.py talks to Google's mail and OAuth services (AGENTS.md, "Email stays on the
      server"): call it rather than naming Google's hosts elsewhere.
    severity: ERROR
    languages: [python]
    pattern-regex: (gmail\.googleapis\.com|oauth2\.googleapis\.com|accounts\.google\.com|www\.googleapis\.com)
    paths:
      include: ["/waypoint/", "/run.py"]
      exclude: ["/waypoint/providers/gmail.py"]

  - id: waypoint-flightstatus-hosts
    message: >-
      Only waypoint/providers/flightstatus.py talks to the flight status service (RapidAPI's AeroDataBox), so what a
      request carries (a flight number and a date, nothing else) and the key stay in one place (AGENTS.md, "Email stays
      on the server"): call it rather than naming its hosts elsewhere.
    severity: ERROR
    languages: [python]
    pattern-regex: (?i)(rapidapi\.com|aerodatabox\.)
    paths:
      include: ["/waypoint/", "/run.py"]
      exclude: ["/waypoint/providers/flightstatus.py"]

  - id: waypoint-logodev-hosts
    message: >-
      Only waypoint/providers/logodev.py talks to Logo.dev, so what a request carries (a brand's name, never a traveller, a
      date or a confirmation code) and the keys stay in one place (AGENTS.md, "Email stays on the server"): call it rather
      than naming its hosts elsewhere.
    severity: ERROR
    languages: [python]
    pattern-regex: (?i)(img|api)\.logo\.dev
    paths:
      include: ["/waypoint/", "/run.py"]
      exclude: ["/waypoint/providers/logodev.py"]

  - id: waypoint-wikimedia-hosts
    message: >-
      Only waypoint/providers/wikimedia.py talks to Wikidata and Wikimedia Commons, so what a request carries (a hotel brand's
      name, never a traveller, a date, a confirmation code or the rest of a hotel's name) stays in one place (AGENTS.md, "Email
      stays on the server"): call it rather than naming its hosts elsewhere.
    severity: ERROR
    languages: [python]
    pattern-regex: (?i)(wikidata|wikimedia)\.org
    paths:
      include: ["/waypoint/", "/run.py"]
      exclude: ["/waypoint/providers/wikimedia.py"]

  - id: waypoint-ai-hosts
    message: >-
      Only waypoint/domain/mail/ai.py may send anything to an AI service, and only when the household turned the AI
      fallback on (AGENTS.md, "Email stays on the server").
    severity: ERROR
    languages: [python]
    pattern-regex: (openrouter\.ai|api\.anthropic\.com|api\.openai\.com|/api/chat\b|/api/generate\b|11434)
    paths:
      include: ["/waypoint/", "/run.py"]
      exclude: ["/waypoint/domain/mail/ai.py"]

  - id: waypoint-message-body
    message: >-
      A message's body (Gmail's `payload`, `raw` and `parts`, the decoded text, an email parsed into parts) is read
      only in waypoint/domain/mail/extract.py, in memory, and what leaves it is the fields of a booking, or the cleaned copy
      kept while a review item or a booking needs it (extract.keep(); AGENTS.md, "Email stays on the server"). Pass the
      message to extract.read() or extract.keep() instead of looking inside it.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: $M["payload"]
      - pattern: $M["raw"]
      - pattern: $M["parts"]
      - pattern: $M.get("payload", ...)
      - pattern: $M.get("raw", ...)
      - pattern: $M.get("parts", ...)
      - pattern: $M.get_payload(...)
      - pattern: $M.get_content(...)
      - pattern: email.message_from_bytes(...)
      - pattern: email.message_from_string(...)
      - pattern: email.message_from_binary_file(...)
      - pattern: email.message_from_file(...)
      - pattern: base64.urlsafe_b64decode(...)
      - pattern: base64.b64decode(...)
      - pattern: base64.decodebytes(...)
    paths:
      include: ["/waypoint/domain/", "/waypoint/providers/gmail.py", "/waypoint/server/"]
      exclude: ["/waypoint/domain/mail/extract.py"]

  - id: waypoint-decrypt
    message: >-
      Secrets are decrypted only where they're used: the storage layer (settings), waypoint/oidc.py (a session's ID
      token, for signing out), waypoint/domain/loyalty.py (loyalty and Known Traveler numbers) and
      waypoint/providers/gmail.py (mailbox tokens). Anywhere else, ask one of those.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: secretbox.decrypt(...)
      - pattern: secretbox.decrypt
      - pattern-regex: \bfrom\s+[.\w]*secretbox\s+import\b[^\n]*\bdecrypt\b
    paths:
      include: ["/waypoint/", "/run.py"]
      exclude: ["/waypoint/storage/", "/waypoint/oidc.py", "/waypoint/domain/loyalty.py", "/waypoint/providers/gmail.py"]

  - id: waypoint-trip-visibility
    message: >-
      Trips and segments are read for a request only through the visibility helper (waypoint/domain/visibility.py), so
      nobody sees a trip they aren't on and didn't book (AGENTS.md, "You see the trips you're on"). A trip or segment
      id that isn't visible answers 404.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: select(..., Trip, ...)
      - pattern: select(..., Segment, ...)
      - pattern: select(..., Trip.$C, ...)
      - pattern: select(..., Segment.$C, ...)
      - pattern: select(..., SegmentTraveler, ...)
      - pattern: select(..., SegmentTraveler.$C, ...)
      - pattern: $CONN.orm.get(Trip, ...)
      - pattern: $CONN.orm.get(Segment, ...)
      - pattern: update(Trip)
      - pattern: update(Segment)
      - pattern: delete(Trip)
      - pattern: delete(Segment)
      - pattern: $Q.join(Trip, ...)
      - pattern: $Q.join(Segment, ...)
      - pattern: $Q.join(SegmentTraveler, ...)
      - pattern: $Q.outerjoin(Trip, ...)
      - pattern: $Q.outerjoin(Segment, ...)
      - pattern: $Q.join_from(..., Trip, ...)
      - pattern: $Q.join_from(..., Segment, ...)
      - pattern: $CONN.orm.query(...)
      - pattern: aliased(Trip, ...)
      - pattern: aliased(Segment, ...)
      - pattern: schema.trips
      - pattern: schema.segments
      - pattern: schema.segment_travelers
      - pattern-regex: (?i)\b(from|join|update|into)\s+"?(trips|segments|segment_travelers)\b
    paths:
      include: ["/waypoint/server/"]

  - id: waypoint-naive-now
    message: >-
      A booking's times carry their zone (AGENTS.md, "Times are where they happen"): use datetime.now(zone) or the
      `now` you were given, never a naive datetime.now() or datetime.today() in domain or provider code.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: datetime.now()
      - pattern: datetime.datetime.now()
      - pattern: datetime.today()
      - pattern: datetime.datetime.today()
      - pattern: datetime.fromtimestamp($T)
      - pattern: datetime.datetime.fromtimestamp($T)
    paths:
      include: ["/waypoint/domain/", "/waypoint/providers/"]

  - id: waypoint-no-telemetry
    message: >-
      Waypoint sends nothing about itself to an outside service: no error reporting, analytics or monitoring SDK (AGENTS.md,
      "Private data in logs"). Errors go to its own log through waypoint/monitoring.py.
    severity: ERROR
    languages: [generic]
    pattern-regex: (?i)(\b(sentry|posthog|mixpanel|datadog|dd-trace|newrelic|new_relic|bugsnag|rollbar|honeybadger|logrocket|fullstory|hotjar|google-analytics|googletagmanager|segment\.(io|com))|\bgtag\s*\()
    paths:
      include: ["/waypoint/", "/run.py", "/frontend/src/", "/frontend/index.html", "/frontend/package.json", "/pyproject.toml"]
