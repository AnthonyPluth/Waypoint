name: Waypoint
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
options:
  # The app icon is committed once, under waypoint/static/ (the only place a raster image may live); this copies it
  # into the asset catalog, where it is not committed (ios/.gitignore).
  preGenCommand: cp ../waypoint/static/ios-icon-1024.png Waypoint/Assets.xcassets/AppIcon.appiconset/icon-1024.png
  bundleIdPrefix: com.anthonypluth
  deploymentTarget:
    iOS: "16.0"
packages:
  Capacitor:
    url: https://github.com/ionic-team/capacitor-swift-pm.git
    exactVersion: 8.6.0
targets:
  Waypoint:
    type: application
    platform: iOS
    sources:
      - path: Waypoint
        excludes:
          - public
    resources:
      - path: Waypoint/public
        type: folder
      - path: capacitor.config.json
    dependencies:
      - package: Capacitor
        product: Capacitor
      - package: Capacitor
        product: Cordova
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WAYPOINT_BUNDLE_ID)
        INFOPLIST_FILE: Waypoint/Info.plist
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  WaypointTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Waypoint
schemes:
  Waypoint:
    build:
      targets:
        Waypoint: all
        WaypointTests: [test]
    test:
      targets:
        - WaypointTests
